<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小燕神916 的个人主页</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; margin: 0; padding: 50px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .card { background: rgba(255, 255, 255, 0.15); padding: 30px; border-radius: 20px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2); max-width: 400px; width: 100%; }
        h1 { margin-bottom: 10px; font-size: 2.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        p { font-size: 1.2rem; opacity: 0.9; line-height: 1.6; }
        .badge { background: #4caf50; padding: 5px 15px; border-radius: 50px; font-size: 0.9rem; font-weight: bold; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">已成功上线</span>
        <h1>你好，世界！</h1>
        <p>这是我完全用手机在 GitHub 上制作并发布的第一个网站！</p>
        <p>🚀 未来可期 🚀</p>
    </div>
</body>
</html>
